plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.meowclub.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.meowclub.app'
        minSdk 26
        targetSdk 35
        versionCode 13
        versionName '0.9.1'
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    def props = new Properties()
    def local = rootProject.file('local.properties')
    if (local.exists()) {
        local.withInputStream { props.load(it) }
    }
    def apiUrl = props.getProperty('catch.apiBaseUrl', '').trim()
    if (apiUrl.isEmpty() || apiUrl ==~ /(?i)https:\/\/[^\/]*\.invalid(?::[0-9]+)?\/?/) {
        throw new GradleException('Configure catch.apiBaseUrl in local.properties with your deployed HTTPS backend origin; the placeholder cannot connect.')
    }
    apiUrl = apiUrl.replaceAll('/+$', '')
    if (!(apiUrl ==~ /https:\/\/[A-Za-z0-9.-]+(?::[0-9]+)?/)) {
        throw new GradleException('catch.apiBaseUrl must be an HTTPS origin')
    }
    defaultConfig {
        buildConfigField 'String', 'API_BASE_URL', '"' + apiUrl + '"'
    }

    def signingProps = new Properties()
    def signingFile = rootProject.file('signing.properties')
    if (signingFile.exists()) {
        signingFile.withInputStream { signingProps.load(it) }
        signingConfigs {
            release {
                storeFile rootProject.file(signingProps.getProperty('storeFile'))
                storePassword signingProps.getProperty('storePassword')
                keyAlias signingProps.getProperty('keyAlias')
                keyPassword signingProps.getProperty('keyPassword')
                storeType signingProps.getProperty('storeType', 'PKCS12')
            }
        }
        buildTypes {
            release {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.10.01')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
