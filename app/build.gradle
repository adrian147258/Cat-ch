plugins { id 'com.android.application' }
android { namespace 'com.meowclub.app'; compileSdk 35
 defaultConfig { applicationId 'com.meowclub.app'; minSdk 26; targetSdk 35; versionCode 4; versionName '0.4' }
 buildFeatures { buildConfig true }
 def props = new Properties()
 def local = rootProject.file('local.properties')
 if (local.exists()) { local.withInputStream { props.load(it) } }
 def apiUrl = props.getProperty('catch.apiBaseUrl', 'https://example.invalid')
 if (!(apiUrl ==~ /https:\/\/[A-Za-z0-9.-]+(?::[0-9]+)?/)) { throw new GradleException('catch.apiBaseUrl must be an HTTPS origin') }
 defaultConfig { buildConfigField 'String', 'API_BASE_URL', '"' + apiUrl + '"' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
