<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>猫猫卡册</title>
  <link rel="stylesheet" href="card_draw.css">
  <script defer src="card_draw.js"></script>
</head>
<body>
  <main class="stage" id="stage" aria-label="猫猫卡册">
    <button id="mute" class="glass" type="button" aria-label="静音" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3.5 9h4L12 5v14l-4.5-4h-4z"/>
        <path class="sound" d="M15.5 8.5a5 5 0 0 1 0 7m3-9.5a8.5 8.5 0 0 1 0 12"/>
        <path class="silent" d="m16 9 5 6m0-6-5 6"/>
      </svg>
    </button>
    <div class="display">
      <div class="table-shadow" aria-hidden="true"></div>
      <div class="object" id="object">
        <button class="pack" id="pack" aria-label="猫猫卡包，滑动封口或轻点拆开" type="button" hidden>
          <span class="wrapper">
            <span class="brand">Cat-ch</span>
            <img id="mascot" alt="">
            <span class="pack-title">猫猫卡包</span>
            <span class="crimp"></span>
          </span>
          <span class="seal" id="seal"><span>撕开</span><i aria-hidden="true"></i><b aria-hidden="true">⟶</b></span>
        </button>
        <article class="reveal" id="reveal" hidden aria-label="猫猫卡片" tabindex="-1">
          <div class="card" id="card">
            <div class="card-photo"><img id="art" alt="抽中的猫咪"></div>
            <div class="card-footer">
              <div class="edition"><strong id="tierLabel"></strong><span id="editionNumber"></span></div>
              <span class="signature">Cat-ch</span>
            </div>
            <div class="foil" id="foil"></div>
          </div>
        </article>
      </div>
    </div>
    <p id="hint" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
